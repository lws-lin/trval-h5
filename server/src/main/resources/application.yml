server:
  # 部署时改端口，或用环境变量 SERVER_PORT 覆盖
  port: 8080

spring:
  application:
    name: trval-server
  mvc:
    async:
      request-timeout: 120000

app:
  cors:
    # 部署后前端不在本机时，把线上地址加进来，例如 https://travel.example.com
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
