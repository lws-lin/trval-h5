services:
  server:
    build:
      context: ./server
      args:
        IMAGE_PREFIX: ${IMAGE_PREFIX:-docker.m.daocloud.io/library}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080

  web:
    build:
      context: ./web
      args:
        IMAGE_PREFIX: ${IMAGE_PREFIX:-docker.m.daocloud.io/library}
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      - server
